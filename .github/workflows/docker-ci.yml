name: Docker CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_dockerized_webserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Playwright
        run: npm ci
      - name: Use main Ubuntu package servers
        shell: bash
        run: |
          # Bypass the runner's Azure mirror, which failed DNS resolution.
          sudo tee /etc/apt/sources.list.d/ubuntu.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo tee /etc/apt/apt.conf.d/99-playwright-downloads > /dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
      - name: Set up Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Launch Web Service
        run: docker compose up -d --build
      - name: Wait for Web Service
        timeout-minutes: 5
        run: sh wait-for-webserver.sh
      - name: Run Playwright Tests
        run: npx playwright test --project=chromium
      - name: Upload Playwright results as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: Playwright results
          path: playwright-report/
      - name: Show Web Service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Web Service
        if: always()
        run: docker compose down
