name: Docker CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_dockerized_webserver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Playwright
        run: npm ci
      - name: Set up Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Launch Web Service
        run: docker compose up -d --build
      - name: Wait for Web Service
        timeout-minutes: 5
        run: sh wait-for-webserver.sh
      - name: Run Playwright Tests
        run: npx playwright test --project=chromium
      - name: Upload Playwright results as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: Playwright results
          path: playwright-report/
      - name: Show Web Service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Web Service
        if: always()
        run: docker compose down
