name: Docker CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_dockerized_webserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Playwright
        run: npm ci
      - name: Set up Playwright Browsers
        shell: bash
        run: |
          # The official image includes browsers and all system dependencies.
          # Match the installed package version to its browser image.
          playwright_version=$(node -p "require('@playwright/test/package.json').version")
          playwright_image="mcr.microsoft.com/playwright:v${playwright_version}-noble"
          docker pull "$playwright_image"
          # Keep this container for the install and test steps so any installed
          # browser files remain available to the tests.
          docker run --detach --init --ipc=host --network=host \
            --name exercise8-playwright \
            --env CI=true \
            --volume "$PWD:/work" \
            --workdir /work \
            "$playwright_image" sleep infinity
          # System libraries are already included; no APT downloads are needed.
          docker exec exercise8-playwright npx playwright install chromium
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Launch Web Service
        run: docker compose up -d --build
      - name: Wait for Web Service
        timeout-minutes: 5
        run: sh wait-for-webserver.sh
      - name: Run Playwright Tests
        run: docker exec exercise8-playwright npx playwright test --project=chromium
      - name: Upload Playwright results as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: Playwright results
          path: playwright-report/
      - name: Show Web Service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Web Service
        if: always()
        run: |
          docker rm --force exercise8-playwright || true
          docker compose down
